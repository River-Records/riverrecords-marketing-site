name: Weekly signal

# Opens a Monday issue with the week's search numbers, already corrected for the traps in
# docs/READING-THE-SIGNAL.md, and asks @claude to interpret it.
#
# Two layers on purpose. The script is deterministic and free: it computes the numbers the
# same way every week so nobody has to remember that brand and non-brand must be split, or
# that two-thirds of clicks are anonymised. The Claude step is the judgement layer — one
# model call a week, on a report of a few hundred words, which is the whole cost.
#
# The judgement step runs HERE rather than relying on claude.yml's @claude trigger.
# GitHub deliberately does not fire workflows from events created with the default
# GITHUB_TOKEN, so an issue opened by this job never triggered it — verified on
# 13 October 2026, when the issue was created and claude.yml was not invoked at all.
# Calling the action directly also removes a cross-workflow dependency that would fail
# silently once a week.
#
# It reports and interprets. It does not change the site. Anything worth doing comes back
# as a suggestion in a comment that a person decides on.
on:
  schedule:
    # 07:00 UTC Monday — half an hour after gsc-snapshot.yml commits the new window.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write   # required by claude-code-action

concurrency:
  group: weekly-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No npm ci — the script uses only node builtins and reads committed JSON.
      - name: Build the report
        id: report
        run: |
          node scripts/weekly-signal.mjs --markdown > signal-report.md
          echo "Report:"; cat signal-report.md

      - name: Open the issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WEEK=$(date -u +%Y-%m-%d)
          {
            echo "@claude — this week's search signal is below, already corrected for the"
            echo "traps in \`docs/READING-THE-SIGNAL.md\`. Please read that file first, then"
            echo "comment on this issue with:"
            echo
            echo "1. **What actually changed**, in three lines or fewer. Lead with anything"
            echo "   that regressed. If nothing moved, say so plainly rather than finding"
            echo "   something to say — a quiet week is a real result."
            echo "2. **Your best reading of why**, and how confident you are. Name the"
            echo "   alternative explanation when there is one."
            echo "3. **One thing worth doing**, or explicitly nothing. At this traffic level"
            echo "   most weeks will not justify an action, and inventing one is worse than"
            echo "   saying so."
            echo
            echo "Rules:"
            echo "- Do not edit the site, open a PR, or change \`READING-THE-SIGNAL.md\`."
            echo "  If a correction in it now looks wrong, say so here and let a human decide."
            echo "- Check a zero-click page is not a brand sitelink before calling it a problem."
            echo "- Never quote a 12-month figure without its last-28-day counterpart."
            echo "- The ceiling on ranking work in the documentation category is low and"
            echo "  known. Be sceptical of any suggestion whose payoff is \"rank better\"."
            echo
            echo "---"
            echo
            cat signal-report.md
          } > /tmp/issue.md
          URL=$(gh issue create \
            --title "Weekly signal — $WEEK" \
            --label "signal" \
            --body-file /tmp/issue.md \
            --repo "${{ github.repository }}")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "number=${URL##*/}" >> "$GITHUB_OUTPUT"
          echo "Opened $URL"

      # The judgement layer.
      #
      # Claude WRITES A FILE; the next step posts it. It does not post the comment
      # itself, and that is deliberate rather than stylistic. On 15 October the action
      # ran correctly in agent mode — "Mode: agent", "Trigger result: true", five turns,
      # $0.15 — and produced no comment, with permission_denials_count: 3. The docs say
      # comment tools are part of the always-available base set, but in agent mode on a
      # workflow_dispatch event they evidently are not granted. Writing a file needs only
      # the file tools, and the posting step uses the same GITHUB_TOKEN that already
      # opens the issue a few lines above, so neither half depends on a behaviour we
      # cannot see or control.
      - name: Interpret
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Read,Grep,Glob,Write"
          prompt: |
            Two files in the working directory: docs/READING-THE-SIGNAL.md, which explains
            corrections to this data that are not obvious and were each got wrong before
            being written down, and signal-report.md, this week's numbers.

            Read the playbook first. Then write your interpretation to a new file called
            interpretation.md in the working directory. Write nothing else, change no
            other file, and do not commit anything.

            The file should be short — comment-length, not a report — and cover:

            1. What actually changed, in three lines or fewer. Lead with anything that
               regressed. If nothing moved, say so plainly rather than finding something
               to say; a quiet week is a real result and padding it makes the next one
               harder to read.
            2. Your best reading of why, and how confident you are. Name the alternative
               explanation when there is one.
            3. One thing worth doing, or explicitly nothing. At this traffic level most
               weeks will not justify an action, and inventing one is worse than saying so.

            Constraints:
            - Do not propose edits to the site, and do not rewrite the playbook. If a
              correction in it now looks wrong, say so in the file and let a human decide.
            - Check a zero-click page is not a brand sitelink before calling it a problem.
            - Never quote a 12-month figure without its last-28-day counterpart.
            - The ceiling on ranking work in the documentation category is measured and
              low. Be sceptical of any suggestion whose payoff is "rank better".

      - name: Post the interpretation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s interpretation.md ]; then
            echo "No interpretation produced — leaving the report to stand on its own."
            gh issue comment "${{ steps.issue.outputs.number }}" \
              --repo "${{ github.repository }}" \
              --body "_The interpretation step produced nothing this week. The numbers above are still correct; only the commentary is missing._"
            exit 0
          fi
          gh issue comment "${{ steps.issue.outputs.number }}" \
            --repo "${{ github.repository }}" \
            --body-file interpretation.md
          echo "Commented on issue #${{ steps.issue.outputs.number }}"
